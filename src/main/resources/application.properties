spring.application.name=docmind-ai

spring.datasource.url=jdbc:postgresql://localhost:5432/knowledgehub_ai
spring.datasource.username=postgres
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

file.upload-dir=uploads

# LLM provider: ollama (default) or kimi
llm.provider=kimi

# Kimi / Moonshot AI configuration (required when llm.provider=kimi)
kimi.base-url=https://litellm.ai.netcracker.cloud/v1/
kimi.model=kimi-k2.7
kimi.api-key=sk-Rc8vsOOREn3fDmJADLRpDQ
